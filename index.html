<!-- ================= JAVASCRIPT (محرك الألفابت الشامل) ================= -->
    <script>
// ================= دالة السحب بالماوس (Drag to Scroll) =================
        function enableMouseDragScroll(sliderId) {
            const slider = document.getElementById(sliderId);
            if (!slider) return;

            let isDown = false;
            let startX;
            let scrollLeft;

            slider.addEventListener('mousedown', (e) => {
                isDown = true;
                slider.style.cursor = 'grabbing';
                startX = e.pageX - slider.offsetLeft;
                scrollLeft = slider.scrollLeft;
            });

            slider.addEventListener('mouseleave', () => {
                isDown = false;
                slider.style.cursor = 'default';
            });

            slider.addEventListener('mouseup', () => {
                isDown = false;
                slider.style.cursor = 'default';
            });

            slider.addEventListener('mousemove', (e) => {
                if (!isDown) return;
                e.preventDefault();
                const x = e.pageX - slider.offsetLeft;
                const walk = (x - startX) * 2; // تسريع السحب
                slider.scrollLeft = scrollLeft - walk;
            });
        }

        const BACKEND_URL = "https://alpha-backend-server.onrender.com";
        let playerSession = null;

        window.onload = () => {
            const savedSession = localStorage.getItem('alpha_player_session');
            if (savedSession) {
                playerSession = JSON.parse(savedSession);
                setupLoggedInUI();
            }
            switchSection('accueil');
            loadGamesOfTheDay();
            
            // تشغيل لمسات الحيوية (الجاكبوت وشريط الفائزين)
            startRealJackpots();
            generateLiveWinnersTicker();
        };

        // ================= 1. التنقل بين الأقسام (Routing) =================
        function switchSection(sectionId) {
            document.querySelectorAll('.player-view-section').forEach(el => {
                el.classList.add('hidden'); el.classList.remove('block');
            });
            const panel = document.getElementById(`pane-${sectionId}`);
            if (panel) {
                panel.classList.remove('hidden');
                panel.classList.add('block');
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ================= 2. نظام الدخول والإشعارات (Auth & Notifications) =================
        function openLoginModal() { document.getElementById('player-login-modal').classList.remove('hidden'); document.getElementById('player-login-modal').classList.add('flex'); }
        function closeLoginModal() { document.getElementById('player-login-modal').classList.add('hidden'); document.getElementById('player-login-modal').classList.remove('flex'); }
        
        function showNotification(msg, type='success') {
            const toast = document.createElement('div');
            toast.className = `p-3 rounded-xl text-white text-xs font-bold ${type==='success'?'bg-emerald-600':'bg-red-600'} mb-2 shadow-lg transition-all border border-white/20`;
            toast.innerText = msg;
            document.getElementById('toast-container').appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        async function handlePlayerAuth() {
            const username = document.getElementById('p-auth-username').value.trim();
            const password = document.getElementById('p-auth-password').value;
            if(!username || !password) return;
            try {
                const res = await fetch(`${BACKEND_URL}/api/login`, {
                    method: 'POST', headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({username, password})
                });
                const data = await res.json();
                if(res.ok) {
                    playerSession = data;
                    localStorage.setItem('alpha_player_session', JSON.stringify(data));
                    localStorage.setItem('token', data.access_token);
                    setupLoggedInUI();
                    showNotification("Bienvenue ! 🟢");
                } else showNotification(data.detail, 'error');
            } catch(e) { showNotification("Erreur serveur", 'error'); }
        }

        function setupLoggedInUI() {
            closeLoginModal();
            const authBtns = document.getElementById('auth-buttons-container');
            if(authBtns) authBtns.classList.add('hidden');
            const userProfile = document.getElementById('top-user-profile');
            if(userProfile) { userProfile.classList.remove('hidden'); userProfile.classList.add('flex'); }
            
            const nameDisplay = document.getElementById('player-name-display');
            if(nameDisplay) nameDisplay.innerText = playerSession.username;
            
            refreshBalance();
            setInterval(refreshBalance, 5000);
        }

        function logoutPlayer() {
            playerSession = null;
            localStorage.clear();
            location.reload();
        }

        async function refreshBalance() {
            if(!playerSession) return;
            try {
                const res = await fetch(`${BACKEND_URL}/gold_api`, {
                    method: 'POST', headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({method: 'user_balance', user_code: playerSession.username})
                });
                const data = await res.json();
                if(data.user_balance !== undefined) {
                    playerSession.balance = data.user_balance;
                    document.getElementById('player-balance-val').innerText = parseFloat(data.user_balance).toFixed(2);
                }
            } catch(e){}
        }

        function getAuthHeaders() { return {'Authorization': `Bearer ${localStorage.getItem('token')}`, 'Content-Type': 'application/json'}; }

        // ================= 3. المحركات (الرياضة، الكازينو، الافتراضي) =================
        async function openSportsbookForProvider(providerCode) {
            if (!playerSession) return openLoginModal();
            switchSection('sport');
            
            const iframe = document.getElementById('sportsbook-iframe');
            const bettechContainer = document.getElementById('bettech');
            const loader = document.getElementById('casino-loader'); 
            
            if(loader) loader.classList.remove('hidden');
            if(iframe) iframe.classList.add('hidden');
            if(bettechContainer) bettechContainer.classList.add('hidden');

            try {
                const response = await fetch(`${BACKEND_URL}/api/provider/launch-sportsbook`, {
                    method: 'POST', headers: getAuthHeaders(),
                    body: JSON.stringify({ provider_code: providerCode, user_code: playerSession.username, game_code: "SPORTSBOOK" })
                });
                const data = await response.json();

                if (data.launch_url) {
                    if(loader) loader.classList.add('hidden');
                    if (providerCode === 'smpl') {
                        if(bettechContainer) bettechContainer.classList.remove('hidden');
                        const htmlRes = await fetch(data.launch_url);
                        bettechContainer.innerHTML = await htmlRes.text();
                        Array.from(bettechContainer.querySelectorAll("script")).forEach(oldScript => {
                            const newScript = document.createElement("script");
                            Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                            newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                            oldScript.parentNode.replaceChild(newScript, oldScript);
                        });
                    } else {
                        if(iframe) iframe.classList.remove('hidden');
                        iframe.src = data.launch_url;
                    }
                } else {
                    if(loader) loader.classList.add('hidden');
                    showNotification("Sportsbook non disponible", "error");
                }
            } catch (error) { if(loader) loader.classList.add('hidden'); showNotification("Erreur réseau", "error"); }
        }

async function loadGamesOfTheDay() {
            const grid = document.getElementById('games-of-the-day-grid');
            if(grid) grid.innerHTML = '<div class="col-span-full text-emerald text-center py-5 animate-pulse">Chargement des jeux... ⏳</div>';
            
            try {
                const res = await fetch(`${BACKEND_URL}/api/smpl/games-by-provider`, {
                    method: 'POST', headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({provider_code: 'pragmatic'}) 
                });
                const data = await res.json();
                let games = data.games || data.data || [];
                
                if (games.length > 0) games = games.reverse();
                
                if(games.length > 0 && grid) {
                    grid.innerHTML = games.slice(0, 12).map(g => {
                        const code = g.uuid || g.game_uuid || g.id;
                        const title = g.game_name || g.name || "Game";
                        
                        let img = g.image || g.icon || g.banner || g.thumb || g.thumbnail || g.url_thumb;
                        const fallbackImg = `https://placehold.co/400x400/180A2B/10b981?text=${encodeURIComponent(title.substring(0, 15))}`;
                        if(!img || img === "") img = fallbackImg;

                        return `
                        <div onclick="playSMPLGame('${code}')" class="bg-[#0f1117] border border-[#212631] rounded-xl overflow-hidden cursor-pointer hover:border-emerald transition-all shadow-lg group">
                            <div class="relative w-full aspect-square overflow-hidden bg-black">
                                <img src="${img}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" onerror="this.onerror=null; this.src='${fallbackImg}';">
                                <div class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 flex items-center justify-center transition-opacity duration-300">
                                    <span class="bg-emerald text-black text-[10px] font-bold px-4 py-2 rounded-full shadow-lg">JOUER</span>
                                </div>
                            </div>
                            <div class="p-2 text-[10px] text-white font-bold truncate text-center">${title}</div>
                        </div>
                    `}).join('');
                } else {
                    if(grid) grid.innerHTML = '<div class="col-span-full text-gray-500 text-center py-5">Aucun jeu trouvé.</div>';
                }
            } catch(e) {
                if(grid) grid.innerHTML = '<div class="col-span-full text-red-500 text-center py-5">Erreur de connexion ❌</div>';
            }
        }
        
        async function initCasinoLobby() {
            const bar = document.getElementById('providers-bar');
            
            if (smplCasinoProviders.length === 0) {
                if(bar) bar.innerHTML = '<span class="text-emerald text-xs animate-pulse">Chargement des fournisseurs... ⏳</span>';
                try {
                    const res = await fetch(`${BACKEND_URL}/api/smpl/providers`);
                    const data = await res.json();
                    let providers = data.providers || data.data || [];
                    
                    if (providers.length > 0) {
                        // 🌟 القائمة الذهبية للمزودين (اكتب كود الشركة هنا لتظهر في الأول)
                        const priorityList = ['pragmaticplay', 'Wazdan', 'Red Tiger', 'Thunderkick', 'Playson', 'NetEnt', 'Playtech', 'Yggdrasil', 'Quickspin', 'Push Gaming', 'Blueprint', 'ELK Studios', 'Betsoft', 'Habanero', 'iSoftBet', 'Relax Gaming', 'Booming Games', 'Nolimit City', 'Big Time Gaming'];
                        
                        // خوارزمية ترتيب المزودين بذكاء
                        providers.sort((a, b) => {
                            const indexA = priorityList.indexOf((a.code || "").toLowerCase());
                            const indexB = priorityList.indexOf((b.code || "").toLowerCase());
                            
                            if (indexA !== -1 && indexB !== -1) return indexA - indexB; // كلاهما في القائمة، نرتب حسب الأسبقية
                            if (indexA !== -1) return -1; // A في القائمة، يذهب للأول
                            if (indexB !== -1) return 1;  // B في القائمة، يذهب للأول
                            return (a.name || "").localeCompare(b.name || ""); // البقية ترتيب أبجدي
                        });
                        
                        smplCasinoProviders = providers;

                        if(bar) {
                            bar.innerHTML = smplCasinoProviders.map(p => 
                                `<button id="btn-prov-${p.code}" onclick="loadProviderGames('${p.code}')" class="casino-prov-btn bg-[#1a1e29] border border-[#212631] hover:border-emerald px-4 py-2 rounded-xl text-xs font-bold text-gray-300 hover:text-white shrink-0 transition-all shadow-sm">${p.name || p.code}</button>`
                            ).join('');
                        }
                        
                        // تفعيل السحب بالماوس
                        setTimeout(() => { if(typeof enableMouseDragScroll === 'function') enableMouseDragScroll('providers-bar'); }, 200);
                        
                        // فتح ألعاب أول شركة تلقائياً
                        loadProviderGames(smplCasinoProviders[0].code);
                    } else {
                        if(bar) bar.innerHTML = '<span class="text-gray-500 text-xs">Aucun fournisseur trouvé</span>';
                    }
                } catch(e) {
                    if(bar) bar.innerHTML = '<span class="text-red-500 text-xs">Erreur de chargement</span>';
                }
            } else {
                if(smplCasinoProviders.length > 0) loadProviderGames(smplCasinoProviders[0].code);
            }
        }

                });

                if (games.length > 0) {

                }

                    grid.innerHTML = games.slice(0, 60).map(g => {

                        const title = g.game_name || g.name || "Game";
                        
                        // 🌟 اصطياد الصورة وتوليد صورة بديلة باسم اللعبة

                        return `

            }
        }
        
        async function playSMPLGame(gameUuid) {
            if(!playerSession) return openLoginModal();
            document.getElementById('casino-iframe-container').classList.remove('hidden');
            document.getElementById('casino-iframe-container').classList.add('flex');
            
            const iframe = document.getElementById('casino-iframe');
            iframe.src = ''; 
            
            try {
                const res = await fetch(`${BACKEND_URL}/api/smpl/launch`, {
                    method: 'POST', headers: getAuthHeaders(),
                    body: JSON.stringify({game_uuid: gameUuid, user_code: playerSession.username})
                });
                const data = await res.json();
                
                if(data.launch_url || data.url) {
                    iframe.src = data.launch_url || data.url;
                } else {
                    showNotification(data.error || "Jeu non disponible", "error");
                    closeCasinoGame();
                }
            } catch(e) { 
                showNotification("Erreur de connexion", "error");
                closeCasinoGame(); 
            }
        }

            document.getElementById('casino-iframe-container').classList.remove('hidden');
            document.getElementById('casino-iframe-container').classList.add('flex');
            try {
                const res = await fetch(`${BACKEND_URL}/api/provider/launch-eurovirtuals`, {
                    method: 'POST', headers: getAuthHeaders(),
                    body: JSON.stringify({user_code: playerSession.username, game_uuid: uuid})
                });
                const data = await res.json();
                if(data.launch_url) document.getElementById('casino-iframe').src = data.launch_url;

            if(!playerSession) return openLoginModal();
            document.getElementById('casino-iframe-container').classList.remove('hidden');
            document.getElementById('casino-iframe-container').classList.add('flex');
            try {
                const res = await fetch(`${BACKEND_URL}/api/provider/launch-casino`, {
                    method: 'POST', headers: getAuthHeaders(),

            document.getElementById('casino-iframe-container').classList.add('hidden');

        // ================= 4. الكاشير (Dépôt & Retrait) =================
        function toggleCashier() {
            if (!playerSession) return openLoginModal();
            const modal = document.getElementById('cashier-modal');
            if (modal.classList.contains('hidden')) { 
                modal.classList.remove('hidden'); modal.classList.add('flex'); 
                document.getElementById('modal-balance').innerText = parseFloat(playerSession.balance || 0).toFixed(2);
            } else { 
                modal.classList.add('hidden'); modal.classList.remove('flex'); 
            }
        }

            document.getElementById('payment-methods-grid').classList.remove('hidden');

                if(document.getElementById(id)) document.getElementById(id).classList.add('hidden');

        function updateFileName(method) {
            const fileInput = document.getElementById(method + '-file');
            const labelSpan = fileInput.previousElementSibling.querySelector('span');
            if (fileInput.files && fileInput.files.length > 0) {
                labelSpan.innerHTML = "✅ " + fileInput.files[0].name;
                labelSpan.classList.add("text-emerald", "font-bold");
                labelSpan.classList.remove("text-gray-300");
            }
        }

        function getBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader(); reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        async function submitDeposit(method) {
            if (!playerSession) return;
            const codeInput = document.getElementById(method + "-code");
            const fileInput = document.getElementById(method + "-file");
            let pinCode = codeInput ? codeInput.value : "";
            if (!pinCode && (!fileInput || fileInput.files.length === 0)) return showNotification("Données manquantes", "error");

            try {
                let receiptBase64 = null;
                if (fileInput && fileInput.files.length > 0) receiptBase64 = await getBase64(fileInput.files[0]);
                const response = await fetch(`${BACKEND_URL}/api/deposit`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ player: playerSession.username, method: method.toUpperCase(), amount: 0, code: pinCode, receipt_image: receiptBase64 })
                });
                if (response.ok) {
                    showNotification("Demande envoyée ! ⏳");
                    toggleCashier();
                    if (codeInput) codeInput.value = "";
                } else showNotification("Erreur", "error");
            } catch (error) { showNotification("Erreur réseau", "error"); }
        }

        function showWithdrawForm(formId) {
            document.querySelectorAll('.withdraw-form').forEach(f => f.classList.add('hidden'));
            document.getElementById(formId).classList.remove('hidden');
        }

        async function submitWithdraw(method) {
            if (!playerSession) return;
            let amountInput, accountInfo;
            if (method === 'mandat') {
                amountInput = document.getElementById('mandat-amount');
                accountInfo = `Mandat: ${document.getElementById('mandat-nom').value}, Tel: ${document.getElementById('mandat-phone').value}`;
            } else if (method === 'd17') {
                amountInput = document.getElementById('d17-amount');
                accountInfo = `D17: ${document.getElementById('d17-nom').value}, Tel: ${document.getElementById('d17-phone').value}`;
            }

            const amount = parseFloat(amountInput.value);
            if (isNaN(amount) || amount <= 0) return showNotification("Montant invalide", "error");
            if (amount > parseFloat(playerSession.balance || 0)) return showNotification("Solde insuffisant!", "error");

            try {
                const response = await fetch(`${BACKEND_URL}/api/admin/request-transaction`, {
                    method: 'POST', headers: getAuthHeaders(),
                    body: new URLSearchParams({
                        target_username: playerSession.username, action: 'withdraw_request',
                        amount: amount, tx_id: `WITHDRAW-${Date.now()}`
                    })
                });
                if (response.ok) {
                    showNotification("Demande envoyée ! 💸");
                    toggleCashier();
                    document.querySelectorAll('.withdraw-form input').forEach(input => input.value = '');
                    refreshBalance();
                } else showNotification("Erreur", "error");
            } catch (error) { showNotification("Erreur", "error"); }
        }

        // ================= 5. لمسات الحيوية (Jackpot, Ticker, Coupon) =================
        function startRealJackpots() {
            const simulateJackpots = () => {
                const now = new Date();
                let megaVal = (((now.getDate() - 1) * 86400 + (now.getHours() * 3600)) / 2592000 * 1000) + 120000;
                const megaEl = document.getElementById('jackpot-mega');
                if(megaEl) megaEl.innerText = megaVal.toFixed(2);
            };
            setInterval(simulateJackpots, 1000);
        }

        function generateLiveWinnersTicker() {
            // يمكن ربطها لاحقاً ببيانات حقيقية، هنا محاكاة بسيطة للواجهة
            // تم تجهيز الدالة لتعمل مع واجهة التيكر إن وجدت مستقبلاً
        }

        function calculatePotentialGain() {
            const stakeInput = document.getElementById('ticket-stake-input');
            const oddsEl = document.getElementById('ticket-total-odds');
            const gainEl = document.getElementById('ticket-potential-gain');
            if(stakeInput && oddsEl && gainEl) {
                const stake = parseFloat(stakeInput.value) || 0;
                const odds = parseFloat(oddsEl.innerText) || 1.00;
                gainEl.innerText = (stake * odds).toFixed(2) + " TND";
            }
        }
    </script>
